components:
  schemas:
    deliveryAreas:
      title: Collection of delivery areas
      type: array
      items:
        $ref: '#/components/schemas/deliveryArea'
    deliveryArea:
      title: DeliveryArea
      type: object
      properties:
        id:
          type: string
        postalcode:
          type: string
        name:
          pattern: ^.+
          type: string
      required:
        - postalcode
        - name
    deliveryTimes:
      title: Collection of delivery times
      type: array
      items:
        $ref: '#/components/schemas/deliveryTime'
    deliveryTime:
      title: DeliveryTime
      type: object
      properties:
        id:
          type: string
        name:
          description: name of the delivery time rule
          type: string
        kind:
          default: DATE
          description: kind of delivery time rule.
          enum:
            - DATE
            - DAYOFWEEK
          type: string
        capacity:
          description: maximum capacity of delivery
          type: number
        cutOffTime:
          allOf:
            - description: cut off time of delivery
            - $ref: '#/components/schemas/CutOffTime'
        zoneId:
          description: Id of the delivery zone
          type: string
        deliveryDate:
          description: The delivery date.
          type: string
          format: date-time
        deliveryDayOfWeek:
          minimum: 0
          maximum: 6
          description: The day of week 0..sunday, 6..saturday.
          type: number
        oneOf:
          type: string
        delivery:
          default: true
          description: true:include rule, false:exclude rule
          type: boolean
        active:
          default: true
          description: With this flag the delivery window time range can be enabled or disabled.
          type: boolean
        activeFrom:
          description: The date from which the time window is active
          type: string
          format: date
        activeTo:
          description: The date to which the time window is active
          type: string
          format: date
        areaIDs:
          description: the delivery areas the rule is intended for.
          type: array
          items:
            type: string
        deliveryTimeRange:
          allOf:
            - description: The delivery time period within a day.
            - $ref: '#/components/schemas/TimeRange'
        metadata:
          $ref: '#/components/schemas/metaData'
      required:
        - name
    CutOffTime:
      title: Cut off time of delivery time
      type: object
      properties:
        id:
          type: string
        weekday:
          minimum: 0
          maximum: 6
          description: The day of week 0..sunday, 6..saturday.
          type: number
        time:
          description: The cut off time
          type: string
          example: '10:30'
        orderCycleName:
          description: Name of the order cycle
          type: string
    AreaDeliveryTimes:
      title: Collection of area delivery times
      type: array
      items:
        $ref: '#/components/schemas/AreaDeliveryTime'
    AreaDeliveryTime:
      title: area delivery time
      type: object
      properties:
        id:
          type: string
        deliveryDate:
          description: The delivery date.
          type: string
          format: date-time
        deliveryTimeRange:
          allOf:
            - type: object
              description: The delivery time period within a day.
            - $ref: '#/components/schemas/TimeRange'
        orderCycle:
          description: Order cycle of the delivery
          type: string
        zoneId:
          description: Id of the delivery zone
          type: string
        metadata:
          $ref: '#/components/schemas/metaData'
      required:
        - deliveryDate
    TimeRange:
      type: object
      properties:
        startTime:
          pattern: ^(2[0-3]|[01]?[0-9]):([0-5]?[0-9])$
          type: string
        endTime:
